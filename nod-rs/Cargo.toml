[package]
name = "nod-rs"
version = "0.1.1"
edition = "2024"
publish = false

[[bin]]
name = "nod"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry"]

[dependencies]
wry = { version = "0.57", optional = true }
tao = { version = "0.37", optional = true }
tiny_http = "0.12"
mime_guess = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-compact = "2"
flate2 = "1"
getrandom = "0.3"
rusqlite = { version = "0.43.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
ureq = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
