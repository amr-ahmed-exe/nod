name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check & lint
        run: |
          pnpm run typecheck
          pnpm run lint

      - name: Build web & setup UI
        run: pnpm run build

      - name: Assemble nod-rs/web bundle
        run: |
          rm -rf nod-rs-web
          mkdir -p nod-rs-web
          cp -a dist/web/. nod-rs-web/
          cp dist/desktop-ui/index.html nod-rs-web/setup.html
          cp dist/desktop-ui/setup.css nod-rs-web/setup.css
          cp dist/desktop-ui/setup.js nod-rs-web/setup.js
          cp dist/desktop-ui/styles.css nod-rs-web/styles.css
          cp dist/desktop-ui/Geist-Variable.woff2 nod-rs-web/Geist-Variable.woff2

      - uses: actions/upload-artifact@v4
        with:
          name: nod-web-assets
          path: nod-rs-web
          retention-days: 1

  rust:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nod-web-assets
          path: nod-rs/web

      - name: Install Linux desktop dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: nod-rs

      - name: Clippy
        run: cargo clippy --manifest-path nod-rs/Cargo.toml --all-targets -- -D clippy::all -D warnings

      - name: Unit tests
        run: cargo test --manifest-path nod-rs/Cargo.toml

      - name: Check headless feature build
        run: cargo clippy --manifest-path nod-rs/Cargo.toml --no-default-features -- -D clippy::all -D warnings
